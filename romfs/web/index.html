<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSA</title>
<style>
/* Colours and shapes come from the console's theme (/theme.json); these are only what shows before it arrives. */
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#dfe3ea;--accent:#2f6df6;--onaccent:#fff;--danger:#d63b3b;--hover:#eef2fb;--success:#1a7f4b;--r:10px;--rs:8px;--bw:1px}
@font-face{font-family:NSAPixel;src:url(/font.ttf)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
body.pixel{font-family:NSAPixel,monospace;font-size:17px}
body.pixel img{image-rendering:pixelated}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:var(--bw) solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .info{color:var(--muted);font-size:13px;margin-left:auto}
nav{display:flex;gap:6px;margin:0 0 10px}
nav button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
main{max-width:1000px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px}
button{font:inherit;color:var(--ink);background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--rs);padding:6px 12px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
button.danger{color:var(--danger)}
input[type=text],input[type=password],select{font:inherit;color:var(--ink);background:var(--bg);border:var(--bw) solid var(--line);border-radius:var(--rs);padding:6px 10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.crumbs{flex:1;min-width:200px;word-break:break-all}
.crumbs a{color:var(--accent);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 8px;border-bottom:var(--bw) solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px}
tr.row:hover{background:var(--hover)}
td.name a{color:var(--ink);text-decoration:none;cursor:pointer;word-break:break-all}
td.name a.dir{color:var(--accent);font-weight:500}
td.num{text-align:right;white-space:nowrap;color:var(--muted)}
td.act{text-align:right;white-space:nowrap}
td.act button{padding:2px 8px;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);margin-top:10px}
.drop.over{border-color:var(--accent);background:var(--hover)}
.login{max-width:340px;margin:12vh auto;text-align:center}
.login input{width:100%;font-size:22px;letter-spacing:6px;text-align:center;margin:12px 0}
.msg{color:var(--danger);min-height:1.4em}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog>div{height:100%;width:0;background:var(--accent)}
body.pixel .prog{border-radius:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:var(--rs);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:.95}
.hide{display:none}
/* titles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.title{display:flex;gap:10px;border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px;background:var(--card)}
.title img{width:48px;height:48px;flex:none;border-radius:var(--rs);background:var(--bg)}
.title .body{min-width:0;flex:1}
.title .t{font-weight:600;word-break:break-word}
.title .s{color:var(--muted);font-size:13px;word-break:break-word}
.badge{display:inline-block;font-size:12px;padding:0 7px;border-radius:var(--rs);background:var(--hover);color:var(--accent);margin-right:4px}
.title .acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.title .acts button{padding:2px 8px;font-size:13px}
.note{color:var(--muted);font-size:13px;margin:6px 0}
dialog{background:var(--card);color:var(--ink);border:var(--bw) solid var(--line);border-radius:var(--r);padding:14px;max-width:min(560px,92vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 8px;font-size:16px}
.choices{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;margin:8px 0}
.choices button{text-align:left}
textarea{font:inherit;width:100%;min-height:90px;color:var(--ink);background:var(--bg);border:var(--bw) solid var(--line);border-radius:var(--rs);padding:8px}
.hist{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:var(--bw) solid var(--line)}
.hist .u{flex:1;min-width:0;word-break:break-all;font-size:13px}
pre.log{max-height:300px;overflow:auto;background:var(--bg);border:var(--bw) solid var(--line);border-radius:var(--rs);padding:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}
h2{font-size:15px;margin:14px 0 6px}
</style>
</head>
<body>
<div id="login" class="login card hide">
  <h1>NSA</h1>
  <div id="t_pin"></div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
  <button class="primary" id="enter"></button>
  <div class="msg" id="loginmsg"></div>
</div>

<div id="app" class="hide">
<header>
  <h1>NSA</h1><span id="console"></span>
  <span class="info" id="space"></span>
</header>
<main>
  <nav><button id="tab_files" class="on"></button><button id="tab_titles"></button><button id="tab_install"></button></nav>

  <div class="card" id="files">
    <div class="bar">
      <div class="crumbs" id="crumbs"></div>
      <button id="up"></button>
      <button id="mkdir"></button>
      <button class="primary" id="uploadbtn"></button>
      <input type="file" id="file" multiple class="hide">
    </div>
    <table>
      <thead><tr><th id="h_name"></th><th class="num" id="h_size"></th><th class="num" id="h_date"></th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="msg" id="empty"></div>
    <div class="drop" id="drop"></div>
    <div id="uploads"></div>
  </div>

  <div class="card hide" id="install">
    <h2 id="h_urls" style="margin-top:0"></h2>
    <textarea id="urls" spellcheck="false"></textarea>
    <div class="bar" style="margin-top:8px"><button class="primary" id="installurls"></button><span class="note" id="urlsnote"></span></div>
    <h2 id="h_hist"></h2>
    <div id="hist"></div>
    <h2 id="h_log"></h2>
    <div class="bar"><button id="reloadlog"></button></div>
    <pre class="log" id="log"></pre>
  </div>

  <div class="card hide" id="titles">
    <div class="bar">
      <input type="text" id="filter">
      <select id="kind"></select>
      <button class="primary" id="sendpkg"></button>
      <input type="file" id="pkg" accept=".nsasave" class="hide">
    </div>
    <div class="note" id="titlesnote"></div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="titlesmsg"></div>
  </div>
</main>
</div>
<dialog id="dlg"><h3 id="dlgtitle"></h3><div class="choices" id="dlgbody"></div><div class="bar"><button id="dlgclose"></button></div></dialog>
<div id="toast"></div>

<script>
const L = (navigator.language||'en').startsWith('es') ? 'es' : 'en';
const T = {
  en:{pin:'Type the PIN shown in the console\'s Settings (Web server).',enter:'Enter',wrong:'Wrong PIN.',locked:'Too many wrong PINs: wait a minute.',up:'Up',mkdir:'New folder',upload:'Upload',name:'Name',size:'Size',date:'Modified',download:'Download',rename:'Rename',del:'Delete',install:'Install',empty:'Empty folder.',drop:'Drop files here to upload them to this folder',free:'free of',newname:'Name of the new folder:',renameto:'New name:',confirmdel:'Delete "%s"? This cannot be undone.',confirminst:'Install "%s" on the console?',done:'Done.',installed:'Installed.',restarting:'Installed. NSA restarts in a few seconds.',failed:'Failed: ',uploading:'Uploading',lost:'Cannot reach the console.',
    files:'Files',titles:'Titles',search:'Search…',k_game:'Games and demos',k_update:'Updates',k_dlc:'DLC',k_system:'System',k_all:'All',sendpkg:'Send a save package to the console',
    note:'Saves, extra data and SpotPass data download as a .nsasave package; a package you send is unpacked on the console, which asks there before replacing anything.',
    save:'Save',ext:'Extra data',boss:'SpotPass',packing:'Packing…',pkgsent:'Sent. Look at the console: it asks what to do.',pkgsentkeep:'Sent and saved on the console (this title or its data is not there, so it cannot be imported).',notitles:'No titles.',loading:'Loading titles…',version:'v',
    install:'Install',h_urls:'Install from URLs (one per line)',installurls:'Send to the console',urlsnote:'The console asks there before installing.',h_hist:'Remote Install history',h_log:'Transfer log',reload:'Reload',again:'Install again',nohist:'Nothing yet.',nolog:'(no log)',
    launch:'Launch',delete:'Delete',delticket:'Delete with ticket',import:'Import',close:'Close',importtitle:'Import %s',nobackups:'No backups of this data (NSA\'s exports or Checkpoint\'s).',asked:'Look at the console: it asks there.',confirmlaunch:'Launch "%s" on the console? (NSA closes.)',confirmdelete:'Ask the console to delete "%s"? It asks again there.'},
  es:{pin:'Escribe el PIN que sale en Ajustes de la consola (Servidor web).',enter:'Entrar',wrong:'PIN incorrecto.',locked:'Demasiados PIN incorrectos: espera un minuto.',up:'Subir nivel',mkdir:'Nueva carpeta',upload:'Subir archivos',name:'Nombre',size:'Tamaño',date:'Modificado',download:'Descargar',rename:'Renombrar',del:'Borrar',install:'Instalar',empty:'Carpeta vacía.',drop:'Suelta aquí archivos para subirlos a esta carpeta',free:'libres de',newname:'Nombre de la carpeta nueva:',renameto:'Nombre nuevo:',confirmdel:'¿Borrar "%s"? No se puede deshacer.',confirminst:'¿Instalar "%s" en la consola?',done:'Hecho.',installed:'Instalado.',restarting:'Instalado. NSA se reinicia en unos segundos.',failed:'Error: ',uploading:'Subiendo',lost:'No se puede contactar con la consola.',
    files:'Archivos',titles:'Títulos',search:'Buscar…',k_game:'Juegos y demos',k_update:'Actualizaciones',k_dlc:'DLC',k_system:'Sistema',k_all:'Todos',sendpkg:'Enviar un paquete de partida a la consola',
    note:'Las partidas, los datos extra y los datos SpotPass se descargan como un paquete .nsasave; un paquete que envíes se desempaqueta en la consola, que pregunta allí antes de reemplazar nada.',
    save:'Partida',ext:'Datos extra',boss:'SpotPass',packing:'Empaquetando…',pkgsent:'Enviado. Mira la consola: te pregunta qué hacer.',pkgsentkeep:'Enviado y guardado en la consola (ese título o sus datos no están, así que no se puede importar).',notitles:'Sin títulos.',loading:'Cargando títulos…',version:'v',
    install:'Instalar',h_urls:'Instalar desde URLs (una por línea)',installurls:'Enviar a la consola',urlsnote:'La consola pregunta allí antes de instalar.',h_hist:'Historial de Remote Install',h_log:'Registro de transferencias',reload:'Recargar',again:'Instalar otra vez',nohist:'Nada todavía.',nolog:'(sin registro)',
    launch:'Lanzar',delete:'Borrar',delticket:'Borrar con ticket',import:'Importar',close:'Cerrar',importtitle:'Importar %s',nobackups:'No hay copias de estos datos (exportaciones de NSA ni de Checkpoint).',asked:'Mira la consola: pregunta allí.',confirmlaunch:'¿Lanzar "%s" en la consola? (NSA se cierra.)',confirmdelete:'¿Pedir a la consola que borre "%s"? Pregunta otra vez allí.'}
}[L];
document.documentElement.lang = L;
const $ = id => document.getElementById(id);
let pin = '', cwd = '/';

function setText(){ $('t_pin').textContent=T.pin; $('enter').textContent=T.enter; $('up').textContent=T.up; $('mkdir').textContent=T.mkdir;
  $('uploadbtn').textContent=T.upload; $('h_name').textContent=T.name; $('h_size').textContent=T.size; $('h_date').textContent=T.date; $('drop').textContent=T.drop;
  $('tab_files').textContent=T.files; $('tab_titles').textContent=T.titles; $('tab_install').textContent=T.install; $('h_urls').textContent=T.h_urls; $('installurls').textContent=T.installurls; $('urlsnote').textContent=T.urlsnote; $('h_hist').textContent=T.h_hist; $('h_log').textContent=T.h_log; $('reloadlog').textContent=T.reload; $('dlgclose').textContent=T.close; $('filter').placeholder=T.search; $('sendpkg').textContent=T.sendpkg; $('titlesnote').textContent=T.note;
  const sel=$('kind'); sel.textContent=''; [['game',T.k_game],['update',T.k_update],['dlc',T.k_dlc],['system',T.k_system],['all',T.k_all]].forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; sel.appendChild(o); }); }
setText();

// The console's theme: colours, corners, borders and (Pixel) its font.
let themeKey = '';
async function loadTheme(){
  try {
    const t = await (await fetch('/theme.json')).json();
    const key = JSON.stringify(t); if(key===themeKey) return; themeKey = key;
    const c = t.colors, s = document.documentElement.style;
    s.setProperty('--bg',c.background); s.setProperty('--card',c.surface); s.setProperty('--line',c.border); s.setProperty('--ink',c.text);
    s.setProperty('--muted',c.muted); s.setProperty('--accent',c.accent); s.setProperty('--onaccent',c.onAccent); s.setProperty('--hover',c.accentSoft);
    s.setProperty('--danger',c.danger); s.setProperty('--success',c.success);
    s.setProperty('--r',t.radius+'px'); s.setProperty('--rs',t.radiusSmall+'px'); s.setProperty('--bw',t.border+'px');
    document.body.classList.toggle('pixel', t.pixel);
  } catch(e){}
}
loadTheme(); setInterval(loadTheme, 5000);

function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),4500); }
function fmtSize(n){ if(n<1024) return n+' B'; const u=['KB','MB','GB','TB']; let i=-1; do{ n/=1024; i++; }while(n>=1024&&i<3); return n.toFixed(n<10?2:1)+' '+u[i]; }
function fmtDate(s){ if(!s) return ''; const d=new Date(s*1000); return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
const q = (k,v) => k+'='+encodeURIComponent(v);

async function api(method, path, params, body){
  let r;
  try { r = await fetch('/api/'+path+(params?'?'+params:''), {method, headers:{'X-Pin':pin}, body}); }
  catch(e){ throw new Error(T.lost); }
  let j = null;
  try { j = await r.json(); } catch(e){}
  if(r.status===401) { const err=new Error(T.wrong); err.auth=true; throw err; }
  if(r.status===429) { const err=new Error(T.locked); err.auth=true; throw err; }
  if(!r.ok || (j && j.ok===false)) throw new Error((j&&j.error)||r.statusText);
  return j;
}

async function login(){
  pin = $('pin').value.trim();
  document.cookie = 'pin='+encodeURIComponent(pin)+'; path=/; SameSite=Strict';
  try {
    const i = await api('GET','info');
    sessionStorage.setItem('pin', pin);
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    $('console').textContent = i.console+' · '+i.version;
    $('space').textContent = fmtSize(i.free)+' '+T.free+' '+fmtSize(i.total);
    go('/');
  } catch(e){ showLogin(e.message); }
}
$('enter').onclick = login;
$('pin').onkeydown = e => { if(e.key==='Enter') login(); };
function showLogin(msg){ $('app').classList.add('hide'); $('login').classList.remove('hide'); $('loginmsg').textContent = msg||''; $('pin').focus(); }
async function run(fn){ try { await fn(); } catch(e){ if(e.auth) showLogin(e.message); else toast(T.failed+e.message); } }

// ---- tabs ----
function tab(name){
  for(const n of ['files','titles','install']){ $(n).classList.toggle('hide', name!==n); $('tab_'+n).classList.toggle('on', name===n); }
  if(name==='titles' && !titlesLoaded) loadTitles();
  if(name==='install') loadInstall();
}
$('tab_files').onclick = () => tab('files'); $('tab_titles').onclick = () => tab('titles'); $('tab_install').onclick = () => tab('install');

// ---- files ----
function crumbs(){
  const c = $('crumbs'); c.textContent='';
  const parts = cwd.split('/').filter(Boolean);
  let path = '/';
  const root = document.createElement('a'); root.textContent='SD'; root.onclick=()=>go('/'); c.appendChild(root);
  parts.forEach(p => { path += p+'/'; const to=path;
    c.appendChild(document.createTextNode(' / '));
    const a=document.createElement('a'); a.textContent=p; a.onclick=()=>go(to); c.appendChild(a); });
}
async function go(path){
  if(!path.endsWith('/')) path += '/';
  try {
    const j = await api('GET','list', q('path', path==='/'?'/':path.slice(0,-1)));
    cwd = path; crumbs();
    const files = j.files.sort((a,b)=> (b.dir-a.dir) || a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));
    const rows = $('rows'); rows.textContent='';
    files.forEach(f => rows.appendChild(row(f)));
    $('empty').textContent = files.length ? '' : T.empty; $('empty').style.color='var(--muted)';
  } catch(e){ if(e.auth) showLogin(e.message); else toast(e.message); }
}
function btn(label, cls, fn){ const b=document.createElement('button'); b.textContent=label; if(cls) b.className=cls; b.onclick=fn; return b; }
function full(f){ return cwd + f.name; }
function row(f){
  const tr = document.createElement('tr'); tr.className='row';
  const n = document.createElement('td'); n.className='name';
  const a = document.createElement('a'); a.textContent = (f.dir?'📁 ':'') + f.name;
  if(f.dir){ a.className='dir'; a.onclick=()=>go(full(f)); }
  else { a.href='/api/file?'+q('path',full(f)); a.download=f.name; }
  n.appendChild(a);
  const s = document.createElement('td'); s.className='num'; s.textContent = f.dir ? '' : fmtSize(f.size);
  const d = document.createElement('td'); d.className='num'; d.textContent = fmtDate(f.mtime);
  const act = document.createElement('td'); act.className='act';
  if(!f.dir && /\.cia$/i.test(f.name)) act.appendChild(btn(T.install,'',()=>install(f)));
  act.appendChild(btn(T.rename,'',()=>rename(f)));
  act.appendChild(btn(T.del,'danger',()=>del(f)));
  tr.append(n,s,d,act); return tr;
}
async function del(f){ if(!confirm(T.confirmdel.replace('%s',f.name))) return;
  run(async()=>{ await api('DELETE','file',q('path',full(f))); toast(T.done); go(cwd); }); }
async function rename(f){ const to = prompt(T.renameto, f.name); if(!to || to===f.name) return;
  run(async()=>{ await api('POST','rename',q('path',full(f))+'&'+q('to',cwd+to)); go(cwd); }); }
async function install(f){ if(!confirm(T.confirminst.replace('%s',f.name))) return;
  run(async()=>{ toast('…'); const j = await api('POST','install',q('path',full(f))); toast(j.restarting?T.restarting:T.installed); }); }
$('mkdir').onclick = () => { const n = prompt(T.newname); if(!n) return;
  run(async()=>{ await api('POST','mkdir',q('path',cwd+n)); go(cwd); }); };
$('up').onclick = () => { const p = cwd.split('/').filter(Boolean); p.pop(); go('/'+p.join('/')); };

// One upload at a time (the console serves one request at a time), with progress. `done(ok)` runs after each.
const queue = []; let busy = false;
function enqueue(files){ for(const f of files) queue.push({file:f, dir:cwd}); pump(); }
function put(path, file, onprogress){
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('PUT', '/api/file?'+q('path', path)); x.setRequestHeader('X-Pin', pin);
    x.upload.onprogress = e => { if(e.lengthComputable) onprogress(e.loaded/e.total); };
    x.onloadend = () => resolve(x.status===200);
    x.send(file);
  });
}
async function pump(){
  if(busy || !queue.length) return; busy = true;
  const job = queue.shift();
  const box = document.createElement('div'); box.style.marginTop='8px';
  const label = document.createElement('div'); label.textContent = T.uploading+' '+job.file.name;
  const bar = document.createElement('div'); bar.className='prog'; const fill = document.createElement('div'); bar.appendChild(fill);
  box.append(label, bar); $('uploads').appendChild(box);
  const ok = await put(job.dir+job.file.name, job.file, f => fill.style.width = (100*f)+'%');
  busy=false; box.remove();
  if(ok) { if(!queue.length) { toast(T.done); go(cwd); } } else toast(T.failed+job.file.name);
  pump();
}
$('uploadbtn').onclick = () => $('file').click();
$('file').onchange = e => { enqueue(e.target.files); e.target.value=''; };
const drop = $('drop');
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => { if(e.dataTransfer && e.dataTransfer.files.length && !$('files').classList.contains('hide')) enqueue(e.dataTransfer.files); });

// ---- titles ----
let titles = [], titlesLoaded = false;
const details = new Map();   // id+media -> details, as they come

async function loadTitles(){
  $('titlesmsg').textContent = T.loading; $('titlesmsg').style.color='var(--muted)';
  try {
    const j = await api('GET','titles');
    titles = j.titles; titlesLoaded = true; $('titlesmsg').textContent=''; renderTitles();
  } catch(e){ $('titlesmsg').textContent=''; if(e.auth) showLogin(e.message); else toast(e.message); }
}
function kindMatches(t){
  const k = $('kind').value;
  return k==='all' || (k==='game' ? (t.kind==='game'||t.kind==='demo') : k==='system' ? (t.kind==='system'||t.kind==='dsiware') : t.kind===k);
}
function titleKey(t){ return t.id+t.media; }

let detailQueue = [], detailBusy = false;
async function pumpDetails(){
  if(detailBusy) return; detailBusy = true;
  while(detailQueue.length){
    const {t, card} = detailQueue.shift();
    if(!card.isConnected) continue;
    try { const d = await api('GET','title', q('id',t.id)+'&'+q('media',t.media)); details.set(titleKey(t), d); fillCard(t, card, d); }
    catch(e){ if(e.auth){ showLogin(e.message); break; } }
  }
  detailBusy = false;
}

function renderTitles(){
  const text = $('filter').value.trim().toLowerCase();
  const grid = $('grid'); grid.textContent=''; detailQueue = [];
  const shown = titles.filter(t => kindMatches(t) && (!text || t.id.toLowerCase().includes(text) || (details.get(titleKey(t))||{name:''}).name.toLowerCase().includes(text)));
  if(!shown.length) { $('titlesmsg').textContent = T.notitles; return; } $('titlesmsg').textContent='';
  shown.forEach(t => { const card = makeCard(t); grid.appendChild(card);
    const d = details.get(titleKey(t)); if(d) fillCard(t, card, d); else detailQueue.push({t, card}); });
  pumpDetails();
}
function makeCard(t){
  const c = document.createElement('div'); c.className='title';
  const img = document.createElement('img'); img.loading='lazy'; img.alt=''; img.src='/api/icon?'+q('id',t.id)+'&'+q('media',t.media); img.onerror=()=>{ img.style.visibility='hidden'; };
  const b = document.createElement('div'); b.className='body';
  const name = document.createElement('div'); name.className='t'; name.textContent = t.id;
  const sub = document.createElement('div'); sub.className='s';
  const badge = document.createElement('span'); badge.className='badge'; badge.textContent = t.media.toUpperCase();
  const v = t.version; sub.append(badge, document.createTextNode(T.version+((v>>10)&63)+'.'+((v>>4)&63)+'.'+(v&15)+' · '+fmtSize(t.size)));
  const id = document.createElement('div'); id.className='s'; id.textContent = t.id;
  const acts = document.createElement('div'); acts.className='acts';
  b.append(name, sub, id, acts); c.append(img, b); return c;
}
function fillCard(t, card, d){
  card.querySelector('.t').textContent = d.name || t.id;
  const pub = d.publisher ? d.publisher+' · ' : ''; card.querySelectorAll('.s')[1].textContent = pub + (d.code||'') + ' ' + t.id;
  const acts = card.querySelector('.acts'); acts.textContent='';
  [['save',T.save],['ext',T.ext],['boss',T.boss]].forEach(([kind,label]) => { if(d[kind]) {
    acts.appendChild(btn('⬇ '+label,'',()=>downloadSave(t, d, kind, label)));
    acts.appendChild(btn('⬆ '+label,'',()=>importDialog(t, d, kind, label))); } });
  if(t.kind==='game' || t.kind==='demo') acts.appendChild(btn(T.launch,'',()=>launchTitle(t, d)));
  acts.appendChild(btn(T.delete,'danger',()=>deleteTitle(t, d, false)));
  if(t.kind!=='system') acts.appendChild(btn(T.delticket,'danger',()=>deleteTitle(t, d, true)));
}
const tname = (t,d) => (d&&d.name)||t.id;
async function launchTitle(t, d){ if(!confirm(T.confirmlaunch.replace('%s',tname(t,d)))) return;
  run(async()=>{ await api('POST','title/launch', q('id',t.id)+'&'+q('media',t.media)); toast(T.asked); }); }
async function deleteTitle(t, d, ticket){ if(!confirm(T.confirmdelete.replace('%s',tname(t,d)))) return;
  run(async()=>{ await api('POST','title/delete', q('id',t.id)+'&'+q('media',t.media)+'&ticket='+(ticket?1:0)); toast(T.asked); }); }
function importDialog(t, d, kind, label){
  run(async()=>{
    const j = await api('GET','save/backups', q('id',t.id)+'&'+q('media',t.media)+'&'+q('kind',kind));
    $('dlgtitle').textContent = T.importtitle.replace('%s', label+' · '+tname(t,d));
    const body = $('dlgbody'); body.textContent='';
    if(!j.backups.length){ const n=document.createElement('div'); n.className='note'; n.textContent=T.nobackups; body.appendChild(n); }
    j.backups.forEach(b => body.appendChild(btn(b.label,'',()=>{ $('dlg').close();
      run(async()=>{ await api('POST','save/import', q('id',t.id)+'&'+q('media',t.media)+'&'+q('kind',kind)+'&'+q('path',b.path)+'&'+q('name',tname(t,d))); toast(T.asked); }); })));
    $('dlg').showModal();
  });
}
$('dlgclose').onclick = () => $('dlg').close();
async function downloadSave(t, d, kind, label){
  run(async()=>{
    toast(T.packing);
    const j = await api('POST','save/pack', q('id',t.id)+'&'+q('media',t.media)+'&'+q('kind',kind)+'&'+q('name', d.name||t.id));
    const a = document.createElement('a'); a.href='/api/file?'+q('path', j.path); a.download = j.path.split('/').pop(); document.body.appendChild(a); a.click(); a.remove();
    toast(T.done);
  });
}
$('filter').oninput = renderTitles; $('kind').onchange = renderTitles;
$('sendpkg').onclick = () => $('pkg').click();
$('pkg').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  run(async()=>{
    toast(T.uploading+' '+f.name);
    const path = '/nsa/received/'+f.name;
    try { await api('POST','mkdir','path=%2Fnsa%2Freceived'); } catch(e){}
    if(!await put(path, f, ()=>{})) throw new Error(f.name);
    const j = await api('POST','save/receive', q('path',path)+'&import=1');
    toast(j.import ? T.pkgsent : T.pkgsentkeep);
  });
};

// ---- install: URLs, the history of Remote Install, the transfer log ----
function sendUrls(text){
  run(async()=>{ await api('POST','install-url', null, text); toast(T.asked); loadInstall(); });
}
$('installurls').onclick = () => { const t = $('urls').value.trim(); if(t) sendUrls(t+'\n'); };
async function fetchText(path, from){
  const r = await fetch('/api/file?'+q('path',path), {headers: Object.assign({'X-Pin':pin}, from ? {Range:'bytes='+from+'-'} : {})});
  if(!r.ok) return null; return r.text();
}
async function loadInstall(){
  const hist = $('hist'); hist.textContent='';
  try {
    const text = await fetchText('/nsa/history.json');
    const list = text ? JSON.parse(text) : [];
    if(!list.length) hist.textContent = T.nohist;
    list.forEach(h => { const row=document.createElement('div'); row.className='hist';
      const u=document.createElement('div'); u.className='u'; u.textContent=h.urls.trim();
      if(h.time){ const t=document.createElement('div'); t.className='note'; t.textContent=fmtDate(h.time); u.appendChild(t); }
      row.append(u, btn(T.again,'',()=>sendUrls(h.urls))); hist.appendChild(row); });
  } catch(e){ hist.textContent = T.nohist; }
  loadLog();
}
async function loadLog(){
  try {
    const j = await api('GET','list','path=%2Fnsa'); const f = j.files.find(f=>f.name==='transfer-log.txt');
    const text = f ? await fetchText('/nsa/transfer-log.txt', Math.max(0, f.size-20000)) : null;
    $('log').textContent = text ? text.split('\n').slice(-200).join('\n') : T.nolog;
    $('log').scrollTop = 1e9;
  } catch(e){ $('log').textContent = T.nolog; }
}
$('reloadlog').onclick = loadLog;

const saved = sessionStorage.getItem('pin');
if(saved){ $('pin').value = saved; login(); } else showLogin();
</script>
