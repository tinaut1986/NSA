name: Build

# Compile check only; publishing is build-release.yml.
on:
  push:
    branches: [master, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Same pinned image as build-release.yml. Bump deliberately, in both files.
      image: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Build (.3dsx + .cia)
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make clean
          make -j"$(nproc)"

      - name: Name the build
        id: v
        shell: bash
        run: echo "safe=$(git describe --tags --always | tr '+/ ' '---')" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NSA-${{ steps.v.outputs.safe }}
          if-no-files-found: error
          path: |
            output/3ds-arm/NSA.cia
            output/3ds-arm/3ds/NSA/NSA.3dsx
