<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NSA</title>
<style>
/* Colours and shapes come from the console's theme (/theme.json); these are only what shows before it arrives. */
:root{--bg:#f2f3f5;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#dfe3ea;--accent:#185fa5;--onaccent:#fff;--soft:#e3ecf7;--danger:#d63b3b;--success:#1a7f4b;--warning:#c58a00;
  --r:12px;--rs:8px;--bw:1px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);--shadow:0 10px 30px rgba(0,0,0,.18);--fast:.16s;--mid:.28s}
@font-face{font-family:NSAPixel;src:url(/font.ttf)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body,.card,.row,button,input,select,textarea,.rail,.topbar{transition:background-color .45s,color .45s,border-color .45s}
body.pixel{font-family:NSAPixel,monospace;font-size:17px}
body.pixel img,img.px{image-rendering:pixelated}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation-duration:1ms!important;transition-duration:1ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:var(--bw) solid var(--line);border-radius:var(--rs);padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
::selection{background:var(--accent);color:var(--onaccent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* the console's own icons (romfs/icons32.png, tinted like the console does) */
.ic{--s:20px;display:inline-block;flex:none;width:var(--s);height:var(--s);background:currentColor;
  -webkit-mask:url(/icons.png) no-repeat;mask:url(/icons.png) no-repeat;
  -webkit-mask-size:calc(var(--s)*16) auto;mask-size:calc(var(--s)*16) auto;
  -webkit-mask-position:calc(var(--c)*var(--s)*-1) calc(var(--r)*var(--s)*-1);mask-position:calc(var(--c)*var(--s)*-1) calc(var(--r)*var(--s)*-1)}
.ic.s16{--s:16px}.ic.s24{--s:24px}.ic.s32{--s:32px}.ic.s48{--s:48px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--rs);background:var(--card);border:var(--bw) solid var(--line);white-space:nowrap;transition:transform var(--fast) var(--ease),background-color var(--fast),border-color var(--fast),box-shadow var(--fast)}
.btn:hover{background:var(--soft);border-color:var(--accent)}
.btn:active,.tool:active,.row:active,.tile:active,.act:active,.navi:active,.key:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;pointer-events:none}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 9px;border-radius:var(--rs);color:var(--ink);transition:transform var(--fast) var(--ease),background-color var(--fast)}
.tool:hover,.tool.on{background:var(--soft);color:var(--accent)}
.tool .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tool{position:relative}

/* the shell: status bar, menu, screen */
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--card);border-bottom:var(--bw) solid var(--line);font-size:13px;color:var(--muted);min-height:44px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:700;font-size:16px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;transition:background-color .45s}
body.pixel .brand .logo{border-radius:0}
.topbar .sp{flex:1}
.status{display:flex;align-items:center;gap:12px}
.status span{display:inline-flex;align-items:center;gap:5px}
.sdbar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.sdbar>i{display:block;height:100%;background:var(--accent);transition:width .6s var(--ease)}
.rail{background:var(--card);border-right:var(--bw) solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.rail .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.navi{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--rs);color:var(--ink);text-align:left;position:relative;transition:background-color var(--fast),color var(--fast),transform var(--fast) var(--ease)}
.navi:hover{background:var(--soft)}
.navi.on{background:var(--accent);color:var(--onaccent)}
.navi .cnt{margin-left:auto;font-size:12px;opacity:.75}
main{overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0}
.screen{display:flex;flex-direction:column;min-height:0;flex:1;animation:screenIn var(--mid) var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.titlebar{display:flex;align-items:center;gap:6px;padding:12px 18px 10px;flex-wrap:wrap}
.titlebar h2{margin:0 auto 0 0;font-size:20px;display:flex;align-items:center;gap:10px;min-width:0}
.titlebar h2 small{font-size:13px;color:var(--muted);font-weight:400}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
.search input{width:190px;padding-left:34px;transition:width var(--mid) var(--ease),border-color var(--fast),box-shadow var(--fast)}
.search input:focus{width:260px}
.scroll{flex:1;overflow:auto;padding:0 18px 90px;scroll-behavior:smooth}

/* lists, in rows or in a grid, like the console's */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:56px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--rs);text-align:left;width:100%;cursor:pointer;user-select:none;
  transition:transform var(--fast) var(--ease),background-color var(--fast),border-color var(--fast),box-shadow var(--fast),opacity var(--fast)}
.row:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row.sel{background:var(--soft);border-color:var(--accent)}
.row.cut{opacity:.5}
.row.drop{background:var(--soft);border-color:var(--accent);box-shadow:0 0 0 3px var(--soft);transform:scale(1.01)}
.row.dragging{opacity:.4}
.anim .row{animation:rowIn .34s var(--ease) both;animation-delay:calc(min(var(--i,0),24)*18ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list.fwd .row{animation-name:rowFwd}.list.back .row{animation-name:rowBack}
@keyframes rowFwd{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes rowBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.row .pic{width:40px;height:40px;flex:none;border-radius:calc(var(--rs) - 2px);display:grid;place-items:center;background:var(--bg);color:var(--accent);overflow:hidden;position:relative}
.row .pic img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.row .pic img.in{opacity:1}
.sheet .head.hasback{flex-wrap:wrap;row-gap:6px;padding-top:10px}
.sheet .head .backrow{flex:0 0 100%;margin-left:-6px}
.set.sysgrid{max-width:none;display:grid;gap:14px;grid-auto-rows:1fr;grid-template-columns:repeat(auto-fit,minmax(min(100%,max(340px,calc((100% - 14px)/2))),1fr))}
.sysgrid .cells{grid-template-columns:repeat(auto-fill,minmax(min(100%,max(104px,calc((100% - 18px)/4))),1fr))}
.sysgrid .card.dragging{opacity:.45;outline:2px dashed var(--accent);outline-offset:-2px}
.sysgrid .syshd{cursor:grab}
.syshd{display:flex;gap:12px;align-items:center;padding:12px 0 8px}
.syshd .stile{width:44px;height:44px;flex:none;border-radius:var(--rs);background:var(--soft);color:var(--accent);display:grid;place-items:center}
.syshd b{display:block;font-size:17px}.syshd .sub{font-size:12.5px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.mrow .sbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.mrow .sbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.mrow small{color:var(--muted);white-space:nowrap}
.bgraph{margin:0 0 12px;background:var(--bg);border-radius:var(--rs);padding:8px 10px}.bgraph small{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
.bgraph svg{display:block;width:100%;height:70px;margin-top:4px}
.chain{display:flex;flex-direction:column;gap:10px}
.tcard{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);text-align:left;width:100%;cursor:pointer;transition:background-color var(--fast),transform var(--fast) var(--ease)}
.tcard:hover{background:var(--soft)}.tcard:active{transform:scale(.985)}
.tcard .pic{width:56px;height:56px;flex:none;border-radius:calc(var(--rs) - 2px);display:grid;place-items:center;background:var(--bg);color:var(--accent);overflow:hidden}
.tcard .pic img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.tcard .pic img.in{opacity:1}
.tcard .bd{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:56px;gap:2px}
.tcard .top{display:flex;gap:8px;align-items:center}
.tcard .nm{font-weight:600;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .ver{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none}
.tcard .sp{flex:1}
.tcard .sz{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tcard .low{display:flex;gap:10px;align-items:baseline}
.tcard .desc{font-size:12.5px;line-height:1.4;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .meta2{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.row.has-cnt{position:relative}
.row .cnt{position:absolute;left:41px;top:5px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--accent);color:var(--onaccent);font-size:11px;font-weight:600;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--card);pointer-events:none}
.list.grid .row .cnt{left:calc(50% + 14px);top:6px}
.row .chk{position:absolute;inset:0;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);opacity:0;transform:scale(.6);transition:opacity var(--fast),transform var(--fast) var(--spring)}
.row.sel .chk{opacity:1;transform:none}
.row .pic:hover .chk{opacity:.55;transform:none}
.row .txt{flex:1;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.row .chev{color:var(--muted);opacity:0;transform:translateX(-4px);transition:opacity var(--fast),transform var(--fast)}
.row:hover .chev{opacity:1;transform:none}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--soft);color:var(--accent);letter-spacing:.03em}
.cpb{display:inline-flex;flex:none;width:22px;height:22px;padding:2px;box-sizing:border-box;border-radius:5px;background:#0E1936}.cpb svg{width:100%;height:100%}
.nsab{display:inline-flex;flex:none;width:22px;height:22px}.nsab svg{width:100%;height:100%}
.badge.n{background:var(--bg);color:var(--muted)}
.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.list.grid .row{flex-direction:column;justify-content:flex-start;padding:12px 8px 10px;gap:8px;min-height:0;text-align:center}
.list.grid .row .pic{width:64px;height:64px}
.list.grid .row .nm{font-size:12px;font-weight:500;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;height:2.5em}
.list.grid .row .sub,.list.grid .row .meta,.list.grid .row .chev{display:none}
.list.grid .row .txt{width:100%}
.sk{display:inline-block;height:.85em;border-radius:5px;background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:300% 100%;animation:shimmer 1.3s linear infinite;vertical-align:middle}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);padding:60px 20px;text-align:center;animation:screenIn .4s var(--ease)}
.empty .ic{--s:48px;opacity:.5}
.note{color:var(--muted);font-size:13px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:20px;font-weight:700;min-width:0}
.crumbs button{padding:2px 8px;border-radius:var(--rs);transition:background-color var(--fast)}
.crumbs button:hover,.crumbs button.drop{background:var(--soft);color:var(--accent)}
.crumbs .s{color:var(--muted);font-weight:400}
.crumbs button:last-child{color:var(--ink)}

/* the sheet (the console's action sheet), dialogs and the popover */
dialog{padding:0;border:0;background:transparent;color:var(--ink);max-width:none;max-height:none;overflow:visible}
dialog::backdrop{background:rgba(0,0,0,0);transition:background-color var(--mid)}
dialog.open::backdrop{background:rgba(0,0,0,.45)}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:min(520px,100vw)}
.sheet .pane{background:var(--card);border:var(--bw) solid var(--line);border-bottom:0;border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;box-shadow:var(--shadow);max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform var(--mid) var(--ease)}
.sheet.open .pane{transform:none}
.sheet.wide{width:min(900px,100vw)}
@media (min-width:760px){.sheet{inset:0;margin:auto;height:fit-content}.sheet .pane{border-radius:calc(var(--r) + 4px);border-bottom:var(--bw) solid var(--line);transform:translateY(24px) scale(.96);opacity:0;transition:transform var(--mid) var(--spring),opacity var(--fast)}.sheet.open .pane{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
@media (min-width:760px){.grab{display:none}}
.sheet .head{display:flex;gap:14px;padding:16px 18px 10px;align-items:center}
.sheet .head .big{width:72px;height:72px;flex:none;border-radius:var(--r);display:grid;place-items:center;background:var(--bg);color:var(--accent);overflow:hidden}
.sheet .head .big img{width:100%;height:100%;object-fit:contain}
.sheet .head h3{margin:0;font-size:18px;word-break:break-word}
.sheet .head .sub{color:var(--muted);font-size:13px;word-break:break-word}
.sheet .body{overflow:auto;padding:4px 18px 18px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:4px 0 12px}
.cell{background:var(--bg);border-radius:var(--rs);padding:7px 10px;min-width:0}
.cell b{display:block;font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.cell span{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.acts{display:flex;flex-direction:column;gap:2px}
.acts .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 4px 4px}
.act{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--rs);text-align:left;width:100%;transition:background-color var(--fast),transform var(--fast) var(--ease);animation:rowIn .3s var(--ease) both;animation-delay:calc(var(--i,0)*25ms + 60ms)}
.act:hover{background:var(--soft);color:var(--accent)}
.act.danger{color:var(--danger)}
.act.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.act .ic{color:currentColor}
.act small{margin-left:auto;color:var(--muted);font-size:12px}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 18px;flex-wrap:wrap}
.foot .sp{flex:1}
.ask p{margin:4px 0 12px;color:var(--muted)}
.ask input{width:100%}
.menu{position:fixed;z-index:50;min-width:210px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;transform-origin:top left;animation:pop .18s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.menu .act{padding:8px 10px;animation:none}
.menu hr{border:0;border-top:var(--bw) solid var(--line);margin:4px 2px}
.menu .seg{margin:4px}
.menu .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:8px;align-items:center;z-index:60;pointer-events:none;max-width:92vw}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);box-shadow:var(--shadow);animation:toastIn .32s var(--spring);font-size:14px}
.toast.out{animation:toastOut .25s var(--ease) forwards}
.toast.xfer{position:relative;overflow:hidden;padding-bottom:14px}
.toast .xbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(127,127,127,.35)}
.toast .xbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s linear}
.toast.indef .xbar i{width:30%!important;animation:xind 1.2s linear infinite}
@keyframes xind{from{margin-left:-30%}to{margin-left:100%}}
.toast.ok .ic{color:var(--success)}.toast.err .ic{color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.96)}}

/* segmented choices, swatches, sliders, switches */
.seg{display:inline-flex;background:var(--bg);border-radius:calc(var(--rs) + 2px);padding:3px;gap:2px;border:var(--bw) solid var(--line);flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:var(--rs);display:inline-flex;align-items:center;gap:6px;color:var(--muted);transition:background-color var(--fast),color var(--fast),box-shadow var(--fast)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;border:3px solid var(--card);box-shadow:0 0 0 var(--bw) var(--line);transition:transform var(--fast) var(--spring),box-shadow var(--fast)}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--c);transform:scale(1.08)}
.sw .ic{opacity:0;transform:scale(.4);transition:opacity var(--fast),transform var(--fast) var(--spring)}
.sw.on .ic{opacity:1;transform:none}
body.pixel .sw{border-radius:0}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:0;border:0;width:100%;height:28px}
input[type=range]:focus{box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--v,50%) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--card);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform var(--fast) var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background-color var(--fast)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform var(--mid) var(--spring)}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}

/* settings */
.set{max-width:760px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:6px 16px;animation:rowIn .35s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
.card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px;display:flex;align-items:center;gap:8px}
.opt{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:var(--bw) solid var(--line);flex-wrap:wrap}
.card h3+.opt{border-top:0}
.opt>.ic{color:var(--accent)}
.opt .l{flex:1;min-width:160px}
.opt .l b{display:block;font-weight:600}
.opt .l span{color:var(--muted);font-size:13px}
.opt .ctl{display:flex;align-items:center;gap:10px}
.vol{display:flex;align-items:center;gap:10px;width:100%;padding:0 0 10px 34px}
.vol span{width:44px;text-align:right;color:var(--muted);font-size:13px}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.th{width:120px;border-radius:var(--r);border:2px solid var(--line);padding:8px;background:var(--bg);text-align:left;transition:border-color var(--fast),transform var(--fast) var(--spring)}
.th:hover{transform:translateY(-2px)}
.th.on{border-color:var(--accent)}
.th .pv{height:54px;border-radius:6px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px}
.th .pv i{border-radius:4px;background:var(--soft)}.th .pv i:first-child{background:var(--accent)}
.th[data-id=pixel] .pv,.th[data-id=pixel] .pv i{border-radius:0}.th[data-id=pixel]{font-family:NSAPixel,monospace}
.th[data-id=home] .pv{grid-template-columns:1fr 1fr 1fr 1fr}
.th b{font-size:13px}

/* install: big tiles behind which each thing lives, like Remote Install on the console */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;max-width:980px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);text-align:left;transition:transform var(--fast) var(--spring),border-color var(--fast),box-shadow var(--fast);animation:rowIn .35s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
.tile:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.tile .ib{width:46px;height:46px;border-radius:var(--rs);background:var(--soft);color:var(--accent);display:grid;place-items:center;transition:background-color var(--fast),color var(--fast)}
.tile:hover .ib{background:var(--accent);color:var(--onaccent)}
.tile b{font-size:16px}.tile>span{color:var(--muted);font-size:13px}
pre.log{max-height:60vh;overflow:auto;background:var(--bg);border-radius:var(--rs);padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:0}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:var(--bw) solid var(--line)}
.hist:first-child{border-top:0}
.hist .u{flex:1;min-width:0;word-break:break-all;font-size:13px}

/* uploads and the clipboard, floating */
.dock{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:40;pointer-events:none}
.dock>*{pointer-events:auto}
.ups{width:340px;max-width:calc(100vw - 36px);background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:toastIn .3s var(--spring)}
.ups .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600;cursor:pointer}
.ups .hd .sp{flex:1}
.ups .items{max-height:240px;overflow:auto;padding:0 12px 10px}
.ups.min .items{display:none}
.up{padding:6px 0;font-size:13px}
.up .n{display:flex;gap:8px}.up .n span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.up .n span:last-child{color:var(--muted)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.prog.ind>i{width:35%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
body.pixel .prog,body.pixel .prog>i{border-radius:0}
.clip{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--ink);color:var(--bg);border-radius:30px;box-shadow:var(--shadow);animation:toastIn .3s var(--spring);font-size:14px}
.clip .btn{border-radius:20px;padding:6px 14px}
.clip .tool{color:var(--bg)}.clip .tool:hover{background:rgba(255,255,255,.12);color:var(--bg)}
.selbar{display:flex;align-items:center;gap:4px;background:var(--accent);color:var(--onaccent);border-radius:var(--rs);padding:3px 3px 3px 12px;animation:pop .2s var(--spring)}
.selbar .tool{color:var(--onaccent);height:32px}.selbar .tool:hover{background:rgba(255,255,255,.18);color:var(--onaccent)}
.dropzone{position:absolute;inset:8px;border:3px dashed var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,transparent);display:grid;place-items:center;pointer-events:none;z-index:5;opacity:0;transition:opacity var(--fast)}
.dropzone.on{opacity:1}
.dropzone div{background:var(--card);padding:14px 22px;border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-weight:600;color:var(--accent);transform:scale(.95);transition:transform var(--mid) var(--spring)}
.dropzone.on div{transform:none}

/* the picture viewer */
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:grid;place-items:center;animation:fade .2s}
.lightbox img{max-width:92vw;max-height:84vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:zoomIn .3s var(--spring)}
.lightbox .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#ddd;font-size:14px}
.lightbox .tool{position:absolute;color:#fff;width:48px;height:48px}.lightbox .tool:hover{background:rgba(255,255,255,.15);color:#fff}
@keyframes fade{from{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.92)}}

/* the console, live */
.ds{margin:6px auto 30px;width:min(640px,100%);display:flex;flex-direction:column;align-items:center}
.ds .lid,.ds .base{width:100%;background:linear-gradient(160deg,color-mix(in srgb,var(--ink) 88%,var(--accent)),color-mix(in srgb,var(--ink) 96%,#000));border-radius:26px;padding:22px 30px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);display:flex;justify-content:center}
.ds .lid{border-radius:26px 26px 10px 10px}
.ds .hinge{width:92%;height:12px;background:color-mix(in srgb,var(--ink) 80%,#000);border-radius:0 0 8px 8px}
.ds .base{border-radius:10px 10px 30px 30px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:18px 20px 22px}
.ds canvas{background:#000;image-rendering:pixelated;border-radius:4px;max-width:100%;touch-action:none;display:block;box-shadow:0 0 0 3px #111}
#cv_top{width:100%;max-width:600px;aspect-ratio:400/240}
#cv_bottom{width:100%;max-width:400px;aspect-ratio:320/240;cursor:crosshair}
.dpad,.abxy{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px;justify-self:center}
.key{display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 70%,#000);color:#eee;border-radius:8px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s,background-color .08s;user-select:none}
.key:hover{background:var(--accent);color:var(--onaccent)}
.key.down,.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.abxy .key{border-radius:50%}
.side{display:flex;flex-direction:column;gap:14px;align-items:center}
.shoulders{display:flex;gap:6px}
.shoulders .key,.small .key{padding:6px 12px;font-size:12px;border-radius:12px}
.small{display:flex;gap:8px}
.livebar{display:flex;align-items:center;gap:10px;color:#bbb;font-size:12px;margin-top:10px}
.livebar .switch{transform:scale(.85)}

/* sign in */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
.login .box{width:min(380px,100%);background:var(--card);border:var(--bw) solid var(--line);border-radius:calc(var(--r) + 6px);padding:28px 24px;text-align:center;box-shadow:var(--shadow);animation:zoomIn .4s var(--spring)}
.login .logo{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;margin:0 auto 10px}
.login h1{margin:0 0 4px;font-size:24px}
.login p{color:var(--muted);margin:0 0 18px;font-size:14px}
.pins{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.pins i{width:42px;height:52px;border-radius:var(--rs);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:700;background:var(--bg);transition:border-color var(--fast),transform var(--fast) var(--spring)}
.pins i.f{border-color:var(--accent);transform:scale(1.05)}
.pins i.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.pins.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.keypad button{height:50px;border-radius:var(--rs);background:var(--bg);font-size:20px;font-weight:600;transition:transform .08s,background-color var(--fast)}
.keypad button:hover{background:var(--soft);color:var(--accent)}
.keypad button:active{transform:scale(.93)}
.login .msg{color:var(--danger);min-height:1.4em;font-size:14px}
#pinfield{position:absolute;opacity:0;pointer-events:none;width:1px}

textarea.code{width:100%;height:56vh;font:13px/1.45 ui-monospace,Consolas,monospace;resize:vertical;tab-size:4}

/* phones: the menu is a bar at the bottom */
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .rail{grid-row:3;flex-direction:row;border-right:0;border-top:var(--bw) solid var(--line);padding:4px;overflow-x:auto;gap:0}
  .rail .grp{display:none}
  .navi{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;flex:1;min-width:0;align-items:center;text-align:center}
  .navi span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #console{display:none}
  .navi .cnt{display:none}
  .status .opt-wide{display:none}
  .search input{width:130px}.search input:focus{width:170px}
  .scroll{padding:0 10px 90px}.titlebar{padding:10px}
  .ds .base{grid-template-columns:1fr;justify-items:center}
  .dock{right:10px;bottom:78px}.toasts{bottom:80px}
}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="box">
    <div class="logo"><span class="ic s32" data-ic="3ds"></span></div>
    <h1>NSA</h1>
    <p id="t_pin"></p>
    <div class="pins" id="pins"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <input id="pinfield" inputmode="numeric" autocomplete="off" maxlength="6">
    <div class="msg" id="loginmsg"></div>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand"><div class="logo"><span class="ic s16" data-ic="3ds"></span></div>NSA</div>
    <span id="console"></span>
    <span class="sp"></span>
    <div class="status">
      <span class="opt-wide" id="sd"><span class="ic s16" data-ic="device-sd-card"></span><span id="sdtext"></span><span class="sdbar"><i id="sdfill"></i></span></span>
      <span id="wifi"><span class="ic s16" data-ic="wifi"></span></span>
      <span id="battery"></span>
      <span id="clock"></span>
    </div>
  </header>
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>
<div class="dock" id="dock"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="picker" multiple hidden>

// 22050 Hz, a loop without a seam). The page plays that very file, in the console's style and volume, and fetches it again
// (crossfading) when the console makes a new one. A copy is kept in this browser per song.
const MUSIC_GAIN = .8;
let mus = {style:0, mtime:0, src:null, gain:null, busy:false, timer:0};
function musicCtx(){ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); return audio; }
function musicGainNow(){ return settings ? settings.musicVolume/100*MUSIC_GAIN : 0; }
function stopMusic(){
  if(!mus.src) return;
  const {src, gain} = mus; mus.src = null; mus.gain = null; mus.style = 0; mus.mtime = 0;
  try { const t = audio.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value, t); gain.gain.linearRampToValueAtTime(0, t+1); src.stop(t+1.05); } catch(e){}
}
async function musicBuffer(style, mtime){
  const key = 'music/'+style+'/'+mtime;
  let raw = await idbDo('readonly', st => st.get(key));
  if(!raw){
    const r = await fetch(fileUrl('/nsa/music-cache-'+style+'.pcm'), {headers:{'X-Pin':pin}});
    if(r.status===401){ const e = new ApiError(T.wrong); e.auth = true; throw e; }
    if(!r.ok) throw new ApiError(r.statusText);
    raw = await r.arrayBuffer();
    idbDo('readwrite', st => st.put(raw, key));
  }
  const v = new DataView(raw);
  if(raw.byteLength < 20 || v.getUint32(0, true) !== 0x4D41534E) throw new ApiError('music');
  const frames = v.getUint32(12, true), rate = v.getUint32(16, true);
  if(20+frames*2 > raw.byteLength) throw new ApiError('music');
  const ctx = musicCtx(), b = ctx.createBuffer(1, frames, rate), out = b.getChannelData(0);
  for(let i=0;i<frames;i++) out[i] = v.getInt16(20+i*2, true)/32768;
  return b;
}
async function syncMusic(){
  if(mus.busy || !settings) return; mus.busy = true;
  try {
    const want = store.get('pageMusic', true) && settings.music>0 ? settings.music : 0;
    if(!want){ stopMusic(); return; }
    if(mus.src && mus.style===want){ mus.gain.gain.setTargetAtTime(musicGainNow(), audio.currentTime, .2); }
    const j = await api('GET', 'list', {path:'/nsa'});
    const f = (j.files||[]).find(f => f.name==='music-cache-'+want+'.pcm');
    if(!f){ if(mus.style && mus.style!==want) stopMusic(); return; }
    if(mus.src && mus.style===want && mus.mtime===f.mtime) return;
    const buf = await musicBuffer(want, f.mtime);
    if(!store.get('pageMusic', true) || !settings.music) return;
    const ctx = musicCtx(), src = ctx.createBufferSource(), g = ctx.createGain(), t = ctx.currentTime;
    src.buffer = buf; src.loop = true; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(musicGainNow(), t+3.5);
    src.connect(g).connect(ctx.destination); src.start();
    const old = mus.src, oldGain = mus.gain;
    if(old){ oldGain.gain.cancelScheduledValues(t); oldGain.gain.setValueAtTime(oldGain.gain.value, t); oldGain.gain.linearRampToValueAtTime(0, t+3.5); old.stop(t+3.6); }
    mus.src = src; mus.gain = g; mus.style = want; mus.mtime = f.mtime;
    if(ctx.state==='suspended') ctx.resume().catch(() => {});
  } catch(e){ if(e.auth) showLogin(e.message); }
  finally { mus.busy = false; }
}

let pin = '';
class ApiError extends Error {}
// What the console is transferring (info.transfer, or a 503's "busy"), in words: one transfer at a time.
const XFER_KINDS = {'FTP':'k_ftp', 'web page':'k_web', 'download':'k_download', 'another 3DS':'k_console'};
// A fraction as a percentage with two decimals, rounded down (never 100.00 before it is done).
const pct2 = f => (Math.floor(Math.max(0,Math.min(1,f))*10000)/100).toFixed(2);
function busyText(b, key){
  const name = (b.name||'').replace(/\/+$/, '').split('/').pop() || b.name || '';
  return tr(key, {k:T[XFER_KINDS[b.kind]] || b.kind, n:name, p:b.total ? ' ('+pct2(b.done/b.total)+' %)' : ''});
}
async function api(method, path, params, body){
  let r;
  try { r = await fetch('/api/'+path+(params ? '?'+(typeof params==='string' ? params : q(params)) : ''), {method, headers:{'X-Pin':pin}, body}); }
  catch(e){ throw new ApiError(T.lost); }
  let j = null; try { j = await r.json(); } catch(e){}
  if(r.status===401 || r.status===429){ const e = new ApiError(r.status===401 ? T.wrong : T.locked); e.auth = true; throw e; }
  if(r.status===503 && j && j.busy){ const e = new ApiError(busyText(j.busy, 'busy')); e.status = 503; e.busy = j.busy; throw e; }
  if(!r.ok || (j && j.ok===false)){ const e = new ApiError((j && j.error) || r.statusText); e.status = r.status; throw e; }
  return j;
}

// Background loads (names, icons) one at a time, what is on screen first: the console serves one request at a time.
const bgq = []; let bgBusy = false;
const seen = new IntersectionObserver(es => { for(const e of es) e.target._vis = e.isIntersecting; pumpBg(); }, {rootMargin:'200px'});
function later(el, fn, first){ bgq[first ? 'unshift' : 'push']({el, fn}); seen.observe(el); pumpBg(); }
async function pumpBg(){
  if(bgBusy) return; bgBusy = true;
  while(bgq.length){
    let i = bgq.findIndex(j => j.el._vis && j.el.isConnected);
    if(i<0) i = bgq.findIndex(j => j.el.isConnected && j.el.offsetParent);
    if(i<0) i = bgq.findIndex(j => j.el.isConnected);
    if(i<0){ for(const j of bgq) j.el._queued = false; bgq.length = 0; break; }
    const [job] = bgq.splice(i, 1); seen.unobserve(job.el);
    try { await job.fn(); } catch(e){ if(e.auth){ for(const j of bgq) j.el._queued = false; bgq.length = 0; showLogin(e.message); break; } }
  }
  bgBusy = false;
}

  const hash = decodeURIComponent(location.hash.slice(1)) || store.get('screen', 'titles');
  const name = hash.split('/')[0];
  if(!screens[name]) { location.hash = '#titles'; return; }
  if(name!==current || force){
    if(current && screens[current].leave) screens[current].leave();
    current = name; store.set('screen', name); markRail(); closeMenu();
    const m = $('main'); m.textContent = ''; m.append(screens[name].render(hash));
    sfx('tick');
  } else if(screens[name].hash) screens[name].hash(hash);
}

// Grouping, as on the console: an update or DLC whose game is in the list (same low 32 bits of the ID) hides behind it,

const lowId = t => t.id.slice(8);
function linkTitles(){
  extrasOf = new Map(); for(const t of titles){ t._linked = false; }

  for(const t of titles) if(t.kind==='update' || t.kind==='dlc'){ const g = games.get(lowId(t)); if(g){ t._linked = true; if(!extrasOf.has(tkey(g))) extrasOf.set(tkey(g), []); extrasOf.get(tkey(g)).push(t); } }

async function loadTitles(){

const tcName = () => 'tc2.'+(info.console||'');
let tcache = null;
const tcKey = t => t.id+t.media+t.version;
function tcGet(t){ if(!tcache) tcache = store.get(tcName(), {}); return tcache[tcKey(t)]; }
function tcSet(t, d){ if(!tcache) tcache = store.get(tcName(), {}); tcache[tcKey(t)] = d; clearTimeout(tcSet.t); tcSet.t = setTimeout(() => store.set(tcName(), tcache), 1500); }
function idb(){ return idb.p || (idb.p = new Promise(ok => { try { const q = indexedDB.open('nsa-icons', 1); q.onupgradeneeded = () => q.result.createObjectStore('i'); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); } catch(e){ ok(null); } })); }
async function idbDo(mode, fn){ const db = await idb(); if(!db) return null; return new Promise(ok => { try { const tx = db.transaction('i', mode), rq = fn(tx.objectStore('i')); tx.oncomplete = () => ok(rq ? rq.result : null); tx.onerror = tx.onabort = () => ok(null); } catch(e){ ok(null); } }); }
async function titleIcon(t){
  const url = '/api/icon?'+q({id:t.id, media:t.media}), key = tcName()+'/'+tcKey(t);
  if(icons.has(url)) return icons.get(url);
  const blob = await idbDo('readonly', s => s.get(key));
  if(blob){ const u = URL.createObjectURL(blob); icons.set(url, u); return u; }
  const r = await fetch(url, {headers:{'X-Pin':pin}});
  if(r.status===401){ const e = new ApiError(T.wrong); e.auth = true; throw e; }
  if(!r.ok){ icons.set(url, ''); return ''; }
  const b = await r.blob(); idbDo('readwrite', s => s.put(b, key));
  const u = URL.createObjectURL(b); icons.set(url, u); return u;
}
async function loadTitle(t, r){

  r._d = d;
  r.querySelector('.nm').textContent = d.name || t.id;
  r.querySelector('.sub').textContent = [d.publisher, 'v'+fmtVer(t.version), fmtSize(t.size)].filter(Boolean).join(' · ');
  r.title = (d.name||'')+'\n'+t.id;
  sortSoon();
  putIcon(r._pic, await titleIcon(t));
}
let sortTimer = 0;
function sortSoon(){ if(TV.sort==='name' && !sortTimer) sortTimer = setTimeout(() => { sortTimer = 0; applyTitles(); }, 700); }
function applyTitles(animate){

  const name = r => (r._d && r._d.name) || '￿'+r._t.id;
  rows.sort(TV.sort==='size' ? (a,b) => b._t.size-a._t.size : TV.sort==='id' ? (a,b) => a._t.id.localeCompare(b._t.id) : (a,b) => collator.compare(name(a), name(b)));
  let shown = 0;
  for(const r of rows){
    const t = r._t, nm = ((r._d && r._d.name)||'')+' '+((r._d && r._d.publisher)||'')+' '+t.id;
    const ok = kindOk(t) && (TV.media==='all' || t.media===TV.media) && (!TV.text || nm.toLowerCase().includes(TV.text));
    const hide = TV.group && t._linked && (TV.kind==='game' || TV.kind==='all');
    r.hidden = !ok || hide; if(!r.hidden) shown++;
    const n = TV.group && extrasOf.has(tkey(t)) ? extrasOf.get(tkey(t)).length : 0;
    r._count.hidden = !n; r.classList.toggle('has-cnt', n>0); if(n) r._count.textContent = n;

  if(!shown) list.append(emptyEl('search', T.notitles));
  if(animate){ list.classList.remove('anim'); void list.offsetWidth; list.classList.add('anim'); let i = 0; for(const r of rows) if(!r.hidden) r.style.setProperty('--i', i++); }
  const loaded = rows.filter(r => r._d).length;
  $('tcount').textContent = loaded<rows.length ? tr('loaded', {a:loaded, b:rows.length}) : String(shown);
  const c = $('cnt_titles'); if(c) c.textContent = rows.length;

// A game with updates or DLC (grouped) opens its chain, as cards: the game itself and each one hanging from it, with its
// icon, name, publisher, description and a medal for what it is (names that are still missing are asked for here).
function chainSheet(t, r){
  const items = [t, ...extrasOf.get(tkey(t))];
  const kindName = x => ({game:T.kg1, update:T.ku1, dlc:'DLC'}[x.kind] || x.kind);

    const card = h('button', {class:'tcard'}, pic, h('div', {class:'bd'}, h('div', {class:'top'}, nm, h('span', {class:'ver', text:'v'+fmtVer(x.version)}), h('span', {class:'sp'}), h('span', {class:'sz', text:x.media.toUpperCase()+' · '+fmtSize(x.size)}), h('span', {class:'badge', text:kindName(x)})), h('div', {class:'low'}, desc, pub)));
    const fill = () => { const d = row._d; if(!d) return; nm.textContent = d.name || x.id; pub.textContent = d.publisher || ''; desc.textContent = d.description || ''; const im = row._pic.querySelector('img'); if(im) putIcon(pic, im.src); };

// A save package: the console makes it (showing its own progress, B cancels), the page follows it and then downloads it.
let packing = false;
function downloadSave(t, name, kind){
  if(packing){ toast(T.packbusy, 'err'); return; }
  packing = true;
  const card = taskCard('download', name, () => api('POST', 'save/pack/cancel').catch(() => {}));
  (async () => {
    try {
      await api('POST', 'save/pack', {id:t.id, media:t.media, kind, name});
      card.set(null, T.packstart);
      let st;
      for(;;){
        await sleep(500); st = await api('GET', 'save/pack/status');
        if(!st.running) break;
        if(st.counting || !st.total) card.set(null, T.counting); else card.set(st.processed/st.total, T.packing+' '+fmtSize(st.processed)+' / '+fmtSize(st.total));
      }
      if(st.error) throw new ApiError(st.error==='cancelled' ? T.cancelled : st.error);
      // The package, read with progress, then saved by the browser.
      const blob = await getWithProgress(fileUrl(st.path), st.size, (n, total, speed) => card.set(n/total, T.downloading+' '+fmtSize(n)+' / '+fmtSize(total)+' · '+fmtSize(speed)+'/s'));
      const a = h('a', {href:URL.createObjectURL(blob), download:st.path.split('/').pop()}); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      card.done(true, fmtSize(st.size)); sfx('success');
    } catch(e){ if(e.auth) showLogin(e.message); else { card.done(false, e.message); sfx('error'); } }
    packing = false;
  })();
}
function getWithProgress(url, size, onprogress){
  return new Promise((resolve, reject) => { const x = new XMLHttpRequest(), t0 = performance.now(); x.open('GET', url); x.setRequestHeader('X-Pin', pin); x.responseType = 'blob';
    x.onprogress = e => onprogress(e.loaded, e.lengthComputable ? e.total : size, e.loaded/Math.max(.001,(performance.now()-t0)/1000));
    x.onload = async () => { if(x.status===200){ resolve(x.response); return; }
      if(x.status===503){ try { const j = JSON.parse(await x.response.text()); if(j.busy){ reject(new ApiError(busyText(j.busy, 'busy'))); return; } } catch(e){} }
      reject(new ApiError(x.statusText||String(x.status))); };
    x.onerror = () => reject(new ApiError(T.lost)); x.send(); });
}
// A card in the corner for something that takes a while: a bar (null: still waiting), a line of text, and a way to stop it.
function taskCard(icon, title, cancel){
  const fill = h('i'), bar = h('div', {class:'prog ind'}, fill), text = h('div', {class:'note', text:T.loading});
  const stop = cancel ? tool('x', T.cancel, () => { cancel(); stop.disabled = true; }) : null;
  const el = h('div', {class:'ups'}, h('div', {class:'hd', style:'cursor:default'}, ic(icon, 16), h('span', {text:title, style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}), h('span', {class:'sp'}), stop), h('div', {class:'items'}, text, bar));
  $('dock').prepend(el);
  return {
    set(f, t){ bar.classList.toggle('ind', f==null); if(f!=null) fill.style.width = (100*Math.min(1,f))+'%'; text.textContent = t; },
    done(ok, t){ bar.classList.remove('ind'); fill.style.width = '100%'; if(!ok) fill.style.background = 'var(--danger)'; text.textContent = (ok ? '✓ ' : '✕ ')+t; if(stop) stop.remove();
      setTimeout(() => { el.style.transition = 'opacity .4s, transform .4s'; el.style.opacity = 0; el.style.transform = 'translateY(10px)'; setTimeout(() => el.remove(), 400); }, ok ? 4000 : 9000); }
  };
}
// One kind of a title's data: download it as a package, and its backups on the SD card (NSA's exports and Checkpoint's),
// each restored (the console asks, in red) or deleted.

    actions([['download', T.dpack, () => downloadSave(t, name, kind)]], c => s.close(c)),
    h('div', {class:'acts'}, h('div', {class:'lbl', text:T.backups})), list],
    foot:[h('button', {class:'btn', text:T.close, onclick:() => s.close()})]});

    let j; try { j = await api('GET', 'save/backups', {id:t.id, media:t.media, kind}); } catch(e){ if(e.auth) showLogin(e.message); else list.replaceChildren(emptyEl('alert-triangle', e.message)); return; }

      const del = async () => { if(!await confirmAsk(tr('confirmdelbackup', {s:b.label})+(b.pksm ? ' '+T.pknote : b.jksm ? ' '+T.jknote : b.checkpoint ? ' '+T.cpnote : ''), true, T.del)) return;
        run(async () => { await api('POST', 'save/backup/delete', {id:t.id, media:t.media, kind, path:b.path}); sfx('success'); toast(T.done, 'ok'); load(); }); };

function sendPackage(){

    const f = files[0]; if(!f) return;
    run(async () => {

    });

  const stCard = sysCard('storage', 'device-sd-card', st.maker!=='-' ? st.maker+' '+st.product : T.sy_sd, T.sy_cluster+': '+st.cluster,
    [cells([[T.sy_made, st.made], [T.sy_speed, st.speed], [T.sy_writable, st.writable]]), h('div', {style:'margin:0 0 12px'}, bars)]);
  const perHour = b.perHour;
  const left = b.charging && perHour>0.05 ? (100-b.percent)/perHour*3600 : !b.charging && perHour<-0.05 ? b.percent/-perHour*3600 : null;
  const icon = b.charging ? 'battery-charging' : b.level>=5 ? 'battery-4' : b.level>=4 ? 'battery-3' : b.level>=2 ? 'battery-2' : 'battery-1';
  let graph = null;
  if(b.samples.length > 1){
    const lo = Math.max(0, Math.min(...b.samples)-1), hi = Math.min(100, Math.max(...b.samples)+1), W = 300, H = 60, k = Math.max(1, b.samples.length-1);
    const pts = b.samples.map((v, i) => (i*W/k).toFixed(1)+','+(H-(v-lo)/(hi-lo||1)*H).toFixed(1)).join(' ');
    graph = h('div', {class:'bgraph'}, h('small', {}, h('span', {text:T.sy_watched+': '+fmtDur(b.watched)}), h('span', {text:lo.toFixed(0)+' - '+hi.toFixed(0)+' %'})));
    graph.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>');
  } else graph = h('div', {class:'bgraph'}, h('small', {}, h('span', {text:T.sy_measuring})));
  const batCard = sysCard('battery', icon, b.percent.toFixed(b.fine ? 1 : 0)+' %', b.charging ? T.sy_charging : b.adapter ? T.sy_onadapter : T.sy_onbat, [cells([
    [T.sy_voltage, b.fine ? b.voltage.toFixed(2)+' V' : '-'], [T.sy_temp, b.fine ? b.temperature+' °C' : '-'], [T.sy_charger, b.adapter ? T.sy_plugged : T.sy_unplugged],
    [b.charging ? T.sy_chrate : T.sy_drrate, perHour!=null ? (perHour>=0 ? '+' : '')+perHour.toFixed(1)+' %/h' : T.sy_measuring],
    [b.charging ? T.sy_fullin : T.sy_emptyin, left!=null ? fmtDur(left) : '-'], [T.sy_level, b.level+'/5']]), graph]);
  const byKey = {console:consoleCard, network:netCard, storage:stCard, battery:batCard};
  const order = store.get('sysorder', []).filter(k => byKey[k]); for(const k in byKey) if(!order.includes(k)) order.push(k);
  const cards = order.map(k => byKey[k]);
  cards.forEach((card, i) => { card.style.setProperty('--i', i); if(!first) card.style.animation = 'none'; sysDrag(card); });
  box.replaceChildren(h('div', {class:'set sysgrid'}, cards)); box.scrollTop = keep;
}
// The cards can be dragged by their header to put them in another order (kept in this browser). The 10 s refresh waits meanwhile.
let sysDragging = null;
function sysDrag(card){
  const hd = card.querySelector('.syshd');
  hd.onmousedown = () => { card.draggable = true; };
  hd.onmouseup = () => { card.draggable = false; };
  card.ondragstart = e => { sysDragging = card; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', card.dataset.k); } catch(x){} };
  card.ondragend = () => { card.classList.remove('dragging'); card.draggable = false; sysDragging = null; store.set('sysorder', [...card.parentNode.children].map(c => c.dataset.k)); };
  card.ondragover = e => {
    if(!sysDragging || sysDragging===card) return; e.preventDefault();
    // Passing over a card moves the dragged one to that card's place: after it when it came from before, else before it.
    const after = !!(sysDragging.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_FOLLOWING);
    card.parentNode.insertBefore(sysDragging, after ? card.nextSibling : card);
  };
}

// ---- start ----
// The console's QR code (Settings → Web server) carries the PIN as ?pin=: used once, then taken out of the address bar.
const linked = new URLSearchParams(location.search).get('pin');
if(linked) history.replaceState(null, '', location.pathname + location.hash);
const saved = linked || sessionStorage.getItem('pin');
// Without a saved PIN, ask with none: a console set to "no PIN" lets the page in; otherwise the PIN screen shows (and the console
// shows the PIN on its bottom screen).
login(saved || '', true);
</script>
